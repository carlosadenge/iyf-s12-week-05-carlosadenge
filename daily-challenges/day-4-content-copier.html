<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 - Content Copier</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; }
        .box { border: 2px solid #cbd5e1; padding: 1rem; margin: 1rem 0; min-height: 80px; border-radius: 8px; }
        #source { background: #e0f2fe; }
        #target { background: #f0fdf4; }
        button { padding: 0.6rem 1.2rem; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Content Copier</h1>

    <h3>Source</h3>
    <div id="source" class="box">
        This is the source content. It will be copied to the target box.
    </div>

    <button id="copy-btn">Copy Content</button>

    <h3>Target</h3>
    <div id="target" class="box">
        (empty)
    </div>

    <script>
        const source = document.getElementById("source");
        const target = document.getElementById("target");
        const copyBtn = document.getElementById("copy-btn");

        copyBtn.addEventListener("click", function () {
            target.textContent = source.textContent;
        });
    </script>
</body>
</html>
